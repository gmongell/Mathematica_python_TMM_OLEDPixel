name: OLED Python regression tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-oled.txt
      - name: Install numerical dependencies
        run: python -m pip install -r requirements-oled.txt
      - name: Compile changed Python modules
        run: |
          python -m py_compile tmm_OLED9.py white_oled_proxy_optimizer.py white_oled_colorimetry.py white_oled_color_optimizer.py oled_outcoupling_simulation.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
