name: OLED TMM numerical checks

on:
  pull_request:
    paths:
      - 'tmm_OLED9.py'
      - 'tests/test_tmm_oled9.py'
      - 'requirements-tmm-sweep.txt'
      - '.github/workflows/oled-tmm-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-tmm-sweep.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-tmm-sweep.txt
      - name: Compile Python sources
        run: python -m py_compile tmm_OLED9.py tests/test_tmm_oled9.py
      - name: Run numerical smoke and regression tests
        run: python -m pytest -q tests/test_tmm_oled9.py
      - name: Run headless plotting smoke test
        run: python tmm_OLED9.py --wavelength-count 3 --angle-count 3 --output /tmp/oled-transmission-smoke.png
